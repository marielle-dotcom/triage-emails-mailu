# Mailu 2024.06 : postfix (smtp), dovecot (imap), rspamd (antispam),
# ClamAV (antivirus), Roundcube (webmail)
name: mailu

x-mailu: &mailu
  restart: always
  env_file: mailu.env
  dns:
    - 192.168.203.254
  depends_on:
    - resolver

services:
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - "./data/redis:/data"
    depends_on:
      - resolver
    dns:
      - 192.168.203.254

  front:
    <<: *mailu
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}nginx:${MAILU_VERSION:-2024.06}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:25:25"
      - "0.0.0.0:465:465"
      - "0.0.0.0:995:995"
      - "0.0.0.0:993:993"
      - "0.0.0.0:4190:4190"
    networks:
      default:
      webmail:
      # Système de triage, étape 2 : entrée des expéditeurs de test « externes »
      # (10.99.0.10 → front 10.99.0.2:25), sans NAT, pour que Rspamd vérifie SPF/DKIM/DMARC.
      lab-externe:
        ipv4_address: 10.99.0.2
    volumes:
      - "./certs:/certs"
      - "./overrides/nginx:/overrides:ro"

  resolver:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}unbound:${MAILU_VERSION:-2024.06}
    env_file: mailu.env
    restart: always
    # Système de triage, étape 2 : zones DNS de test (overrides/unbound/lab-zones.conf)
    volumes:
      - "./overrides/unbound/unbound.conf:/unbound.conf:ro"
      - "./overrides/unbound:/overrides:ro"
    networks:
      default:
        ipv4_address: 192.168.203.254

  admin:
    <<: *mailu
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}admin:${MAILU_VERSION:-2024.06}
    volumes:
      - "./data/data:/data"
      - "./data/dkim:/dkim"
    depends_on:
      - redis
      - resolver

  imap:
    <<: *mailu
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}dovecot:${MAILU_VERSION:-2024.06}
    volumes:
      - "./data/mail:/mail"
      - "./overrides/dovecot:/overrides:ro"
    depends_on:
      - front
      - resolver

  smtp:
    <<: *mailu
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}postfix:${MAILU_VERSION:-2024.06}
    volumes:
      - "./data/mailqueue:/queue"
      - "./overrides/postfix:/overrides:ro"
    depends_on:
      - front
      - resolver

  oletools:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}oletools:${MAILU_VERSION:-2024.06}
    hostname: oletools
    restart: always
    networks:
      - noinet
    depends_on:
      - resolver
    dns:
      - 192.168.203.254

  antispam:
    <<: *mailu
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}rspamd:${MAILU_VERSION:-2024.06}
    hostname: antispam
    networks:
      - default
      - noinet
      - clamav
    volumes:
      - "./data/filter:/var/lib/rspamd"
      - "./overrides/rspamd:/overrides:ro"
    depends_on:
      - front
      - redis
      - oletools
      - antivirus
      - resolver

  antivirus:
    image: clamav/clamav-debian:1.4
    restart: always
    networks:
      - clamav
    volumes:
      - "./data/clamav:/var/lib/clamav"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  webmail:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}webmail:${MAILU_VERSION:-2024.06}
    restart: always
    env_file: mailu.env
    volumes:
      - "./data/webmail:/data"
      - "./overrides/roundcube:/overrides:ro"
      # Système de triage, étape 4 : plugin du bandeau « Prudence » (N1)
      - "./overrides/roundcube/plugins/triage_banner:/var/www/roundcube/plugins/triage_banner:ro"
    networks:
      - webmail
    depends_on:
      - front

  # Système de triage (filtre After-Queue Python) : reçoit de Postfix sur 10035,
  # réinjecte sur smtp:10036. IP fixe : seule adresse autorisée sur le port 10036.
  # Aucun port publié sur l'hôte.
  triage:
    build: ./triage
    image: mailu-triage:scenario-a
    restart: always
    # Étape 5 : accès à la base des décisions (mot de passe du compte triage_filtre)
    env_file: triage/secrets/filtre.env
    volumes:
      # Stockage de quarantaine séparé de la messagerie (N3, N4) et fichier d'attente
      # des décisions quand la base est indisponible.
      - "./data/quarantaine:/quarantaine"
      - "./data/triage-spool:/spool"
    environment:
      TRIAGE_LISTEN_PORT: "10035"
      TRIAGE_REINJECT_HOST: smtp
      TRIAGE_REINJECT_PORT: "10036"
      TRIAGE_ALLOWED_PEERS: smtp
    networks:
      default:
        ipv4_address: 192.168.203.250
    depends_on:
      - resolver

  # Système de triage, étape 5 : base des décisions (métadonnées uniquement).
  # Aucun port publié : joignable seulement par le filtre, l'outil de quarantaine et Grafana.
  triage-db:
    build: ./triage/db
    image: mailu-triage-db:etape5
    restart: always
    env_file: triage/secrets/db.env
    volumes:
      - "./data/triage-db:/var/lib/postgresql/data"
    networks:
      - default

  # Système de triage, étape 5 : outil de quarantaine (valider, libérer, supprimer).
  # Publié sur 127.0.0.1 seulement ; IP fixe autorisée sur le port de réinjection (libérations).
  triage-ui:
    build: ./triage/ui
    image: mailu-triage-ui:session
    restart: always
    env_file: triage/secrets/ui.env
    environment:
      TRIAGE_UI_ADMINS: "administrateur@anac.lab,admin@anac.lab"
      TRIAGE_IMAP_HOST: front
      TRIAGE_RETENTION_QUARANTAINE_JOURS: "30"
      TRIAGE_RETENTION_DECISIONS_JOURS: "180"
      TZ: Europe/Paris
    volumes:
      - "./data/quarantaine:/quarantaine"
    ports:
      - "127.0.0.1:8088:8000"
    networks:
      default:
        ipv4_address: 192.168.203.251
    depends_on:
      - triage-db

  # Système de triage, étape 5 : tableau de bord (lecture seule sur la base).
  triage-grafana:
    build: ./triage/grafana
    image: mailu-triage-grafana:etape5
    restart: always
    env_file: triage/secrets/grafana.env
    environment:
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/log/grafana
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      # Lab sans Internet : pas de téléchargement automatique d'extensions.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Session : déconnexion après 15 min sans activité, 8 h au plus (défauts Grafana : 7 j et 30 j).
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 15m
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 8h
      GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES: "5"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/triage.json
      TZ: Europe/Paris
    volumes:
      - "./data/grafana:/var/lib/grafana"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
    depends_on:
      - triage-db

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.203.0/24
  webmail:
    driver: bridge
  clamav:
    driver: bridge
  noinet:
    driver: bridge
    internal: true
  # Réseau des expéditeurs de test (étape 2). Interne : pas d'accès Internet,
  # n'est relié qu'au conteneur front.
  lab-externe:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.99.0.0/24
