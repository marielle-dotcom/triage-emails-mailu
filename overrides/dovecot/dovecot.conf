# Système de triage, étape 4 : script Sieve global ajouté après celui de Mailu
# (sieve_before). Script en lecture seule : sa version compilée va dans /tmp.
plugin {
  sieve_before2 = file:/overrides/triage.sieve;bindir=/tmp/sieve-triage
}

# Les dossiers créés à la livraison par le script (Suspect, N3, N4) sont abonnés
# automatiquement, sinon le webmail ne les affiche pas.
lda_mailbox_autosubscribe = yes
